app:
  name: JobHunterX
  database: data/jobbot.sqlite3
  log_file: logs/jobbot.log
  headless_browser: false
  browser_profile_dir: data/browser_profile
targeting:
  target_roles:
  - Senior Data Engineer
  - Data Engineer
  - Cloud Data Engineer
  - AWS Data Engineer
  - Azure Data Engineer
  - Data Platform Engineer
  - Analytics Engineer
  - Senior Data Analyst
  - ETL Developer
  excluded_title_keywords:
  - intern
  - internship
  - junior
  - entry level
  - manager
  - director
  - vice president
  location_scope: united_states
  preferred_locations: []
  allow_remote: true
  allow_hybrid: true
  allow_onsite: true
  remote_allowed: true
  employment_types:
  - full-time
  - contract
  minimum_score_to_prepare: 72
  minimum_score_to_apply: 82
  max_job_age_days: 0
  hard_expire_jobs: false
  max_applications_per_day: 35
  role_mode: adaptive
  adaptive_roles:
    expansion: balanced
    minimum_confidence: 78
    max_active_roles: 18
    learn_from_results: true
    learned_min_job_score: 85
    reanalyze_on_resume_change: true
sponsorship:
  enabled: true
  weight: 0.2
  hide_explicit_no_sponsorship: true
  minimum_visa_score_to_apply: 55
  history_path: data/sponsor_history.json
  accepted_visa_types:
  - H-1B
  - H-1B Transfer
  - OPT
  - STEM OPT
  - CPT
  - TN
  - E-3
continuous_search:
  enabled: true
  interval_hours: 24
  initial_backfill_days: 30
  incremental_overlap_days: 2
  prioritize_jobs_posted_within_hours: 48
  top_tier_score: 90
  daily_prepare_target: 30
  daily_application_target: 20
  follow_up_after_days: 4
  auto_rank: true
  auto_prepare: false
  auto_apply: false
  auto_submit_when_safe: true
seven_day_sprint:
  enabled: false
  prioritize_jobs_posted_within_hours: 48
  top_tier_score: 90
  daily_prepare_target: 30
  daily_application_target: 20
  follow_up_after_days: 4
  auto_submit_when_safe: true
resume:
  master_path: profile/master_resume.docx
  output_dir: output/resumes
  truthful_tailoring_only: true
  reorder_existing_bullets_only: true
application:
  answers_path: profile/application_answers.json
  auto_submit_requires_complete_profile: true
  skip_voluntary_demographic_questions: true
  stop_on_captcha: true
  stop_on_mfa: true
  stop_on_legal_attestation: true
  screenshots_dir: output/screenshots
  require_direct_employer_url_for_auto_apply: true
sources:
  file_import:
    enabled: true
    path: data/import_jobs.json
  jobspipe:
    enabled: true
    results_per_page: 25
    pages_per_run: 1
    posted_at_max_age_days: 3
  adzuna:
    enabled: true
    results_per_page: 20
    max_roles_per_run: 3
  jooble:
    enabled: true
    results_per_page: 20
    max_roles_per_run: 2
  usajobs:
    enabled: true
    results_per_page: 50
    max_roles_per_run: 2
    date_posted_days: 7
  brave_web:
    enabled: true
    results_per_query: 8
    query_budget_per_run: 10
    role_families_per_run: 3
    direct_resolve_queries: 3
    freshness: pw
    source_groups:
      direct_ats: true
      indeed: true
      dice: true
      ziprecruiter: true
      linkedin: true
      company_careers: true
  ats_registry:
    path: data/ats_registry.json
    max_learned_boards_per_run: 20
    max_generic_ats_pages_per_run: 5
  workday:
    enabled: true
    max_results_per_board: 30
    max_role_queries_per_board: 2
  greenhouse:
    enabled: true
    boards: {}
  lever:
    enabled: true
    sites: {}
  ashby:
    enabled: true
    boards: {}
  smartrecruiters:
    enabled: true
    companies: {}
    max_postings_per_company: 100
  career_crawler:
    enabled: true
    auto_enrich_discovered_domains: true
    max_domains_per_run: 10
    max_pages_per_domain: 3
    seed_sites: {}
    max_sitemap_urls: 0
  theirstack:
    enabled: false
    pages: 1
    results_per_page: 25
    require_final_url: false
  serpapi:
    enabled: false
    pages_per_role: 1
    max_roles_per_run: 6
  remotive:
    enabled: false
  platform_coverage:
    linkedin: true
    indeed: true
    dice: true
    ziprecruiter: true
    workday: true
    ashby: true
    smartrecruiters: true
    greenhouse: true
    lever: true
    workable: true
    icims: true
    oracle: true
    successfactors: true
    paylocity: true
    jobvite: true
    dayforce: true
    brassring: true
    company_career_pages: true
  discovery_mesh:
    mode: stable
    state_path: data/discovery_state.json
    retain_unresolved_aggregator_hints: true
    prefer_direct_employer_urls: true
    rotate_roles_each_run: true
    max_generic_ats_pages_per_run: 5
